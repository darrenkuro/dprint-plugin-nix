[package]
name = "dprint-plugin-nix"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Configurable Nix code formatter — dprint plugin"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
dprint-core = { version = "0.67", features = ["formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rnix = "0.11"
anyhow = "1"

[dev-dependencies]
pretty_assertions = "1"

[features]
wasm = ["dprint-core/wasm"]

[profile.release]
opt-level = "s"
lto = true
